<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · perch</title>
<link rel="stylesheet" href="{{.Root}}site.css">
</head>
<body>
<header class="top">
  <a class="brand" href="{{.Root}}"><span class="dot"></span>perch</a>
  <nav class="top-nav">
    <a href="{{.Root}}">Guide</a>
    <a href="{{.Root}}menubar/">menubar.yaml</a>
    <a href="{{.Root}}recipes/launchagent/">Recipes</a>
    <a href="{{.Repo}}">GitHub</a>
  </nav>
  <span class="top-meta">MIT</span>
</header>

<div class="shell">
  <aside class="sidebar">
    {{range .Sections}}
    <div class="group">
      <p class="label">{{.Title}}</p>
      <ul>
        {{range .Links}}<li><a href="{{.Href}}"{{if .Current}} class="current" aria-current="page"{{end}}>{{.Title}}</a></li>{{end}}
      </ul>
    </div>
    {{end}}
  </aside>

  <main>
    <p class="crumb">{{.Section}} / {{.Title}}</p>
    {{.Content}}
    <nav class="pager">
      {{if .Prev}}<a class="prev" href="{{.Prev.Href}}">← {{.Prev.Title}}</a>{{end}}
      {{if .Next}}<a class="next" href="{{.Next.Href}}">{{.Next.Title}} →</a>{{end}}
    </nav>
  </main>
</div>

<footer class="bottom">MIT · <a href="{{.Repo}}">orochi235/perch</a></footer>

<script>
// The state tabs on a preview. Everything else on the page is static.
for (const preview of document.querySelectorAll(".preview")) {
  preview.addEventListener("click", (event) => {
    const button = event.target.closest(".state");
    if (!button) return;
    for (const el of preview.querySelectorAll(".state, .frame")) el.classList.remove("is-on");
    button.classList.add("is-on");
    preview.querySelector(`.frame[data-frame="${button.dataset.frame}"]`).classList.add("is-on");
  });
}
</script>
</body>
</html>
