name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS, because the tests that matter most drive swiftc, plutil and
    # launchctl. On a runner there is no GUI login session, so the one that
    # installs a LaunchAgent and watches the app stay up skips itself.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
      - run: go test ./... -timeout 10m

  fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./bin/fuzz 60
